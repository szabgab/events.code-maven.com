    <style>
/* Custom variables matching Bulma theme */
:root {
    --family-sans-serif: 'Outfit', sans-serif;
}

body {
    font-family: 'Outfit', sans-serif;
}

/* Custom layout spacing tweaks */
.gap-3 {
    gap: 0.75rem !important;
}

/* Tag overrides for events */
.tag.online {
    background-color: #0c3545;
    color: #80e2f8;
    border: 1px solid rgba(6, 182, 212, 0.2);
}
.tag.in-person {
    background-color: #2b1f4c;
    color: #c0b3f8;
    border: 1px solid rgba(167, 139, 250, 0.2);
}

/* Hover effect on card titles */
.card-content .title:hover {
    color: var(--bulma-link-hover) !important;
}

/* Configuration Settings Panel / Drawer */
.settings-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 400px;
    max-width: 100vw;
    height: 100vh;
    background-color: var(--bulma-scheme-main-ter);
    border-left: 1px solid var(--bulma-border-weak);
    z-index: 1000;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex;
    flex-direction: column;
    box-shadow: -4px 0 24px rgba(0, 0, 0, 0.5);
}

.settings-panel.open {
    transform: translateX(0);
}

.settings-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(4px);
    z-index: 999;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
}

.settings-overlay.open {
    opacity: 1;
    pointer-events: auto;
}

.settings-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--bulma-border-weak);
}

.settings-panel-body {
    overflow-y: auto;
    flex-grow: 1;
}

/* Stats counter */
.stats-counter span {
    color: var(--bulma-link);
}

/* Control buttons inside multiselect */
.ctrl-btn {
    border: 1px solid var(--bulma-border-weak);
    background: transparent;
    transition: all 0.2s ease;
}
.ctrl-btn:hover {
    border-color: var(--bulma-link);
    color: var(--bulma-text);
}

/* Tag buttons for filters */
.lang-toggle-btn, .topic-toggle-btn {
    border: 1px solid var(--bulma-border-weak);
    background-color: var(--bulma-scheme-main-bis);
    color: var(--bulma-text-strong);
    transition: all 0.2s ease;
}
.lang-toggle-btn:hover, .topic-toggle-btn:hover {
    border-color: var(--bulma-link);
    background-color: var(--bulma-scheme-main-ter);
}
.lang-toggle-btn.active, .topic-toggle-btn.active {
    background-color: var(--bulma-link) !important;
    color: var(--bulma-scheme-main) !important;
    border-color: transparent;
}

.filter-btn.active {
    background-color: var(--bulma-link) !important;
    color: var(--bulma-scheme-main) !important;
    border-color: transparent;
    font-weight: bold;
}

/* Group link items */
.group-link-item {
    transition: all 0.2s ease;
    border: 1px solid var(--bulma-border-weak);
}
.group-link-item:hover {
    border-color: var(--bulma-link);
    background-color: var(--bulma-scheme-main-bis);
    transform: translateY(-1px);
}

/* Gear Icon animation */
.gear-icon {
    transition: transform 0.5s ease;
}
.settings-toggle-btn:hover .gear-icon {
    transform: rotate(90deg);
}

/* Disabled select inputs */
.select-wrapper.disabled {
    opacity: 0.4;
    pointer-events: none;
}

.time-range-filter select {
    background-color: var(--bulma-scheme-main-bis);
    color: var(--bulma-text);
}

/* No events matching display */
.no-events {
    width: 100%;
}

.groups-toggle-btn {
    text-decoration: underline;
    text-decoration-style: dotted;
    text-underline-offset: 4px;
}

.github-link:hover {
    color: var(--bulma-link) !important;
}

    </style>
</head>

    <script>
let activeType = 'all';
let activeTopics = [];
let timeFilterEnabled = false;
let startAfterHour = 0;
let startBeforeHour = 24;
let activeLanguages = [];

const STORAGE_KEY = 'tech_events_filters_state';

function saveFiltersState() {
    const state = {
        activeType,
        timeFilterEnabled,
        startAfterHour,
        startBeforeHour,
        activeTopics,
        activeLanguages
    };
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {
        console.error('Failed to save filters state to localStorage:', e);
    }
}

function toggleSettingsPanel(event) {
    if (event) {
        event.stopPropagation();
    }
    const overlay = document.getElementById('settings-overlay');
    const panel = document.getElementById('settings-panel');
    if (overlay && panel) {
        overlay.classList.toggle('open');
        panel.classList.toggle('open');
    }
}

let groupsLoaded = false;

function toggleGroupsPanel(event) {
    if (event) {
        event.stopPropagation();
    }
    const overlay = document.getElementById('groups-overlay');
    const panel = document.getElementById('groups-panel');
    if (overlay && panel) {
        const isOpening = !panel.classList.contains('open');
        overlay.classList.toggle('open');
        panel.classList.toggle('open');

        if (isOpening && !groupsLoaded) {
            fetch('groups.json')
                .then(res => res.json())
                .then(groups => {
                    renderGroups(groups);
                    groupsLoaded = true;
                })
                .catch(err => {
                    console.error('Failed to load groups:', err);
                    const list = document.getElementById('groups-list');
                    if (list) {
                        list.innerHTML = '<div class="notification is-danger">Failed to load tracked groups list.</div>';
                    }
                });
        }
    }
}

function renderGroups(groups) {
    const list = document.getElementById('groups-list');
    if (list) {
        list.innerHTML = '';
        if (groups.length === 0) {
            list.innerHTML = '<div class="notification is-light">No tracked groups found.</div>';
        } else {
            groups.forEach(grp => {
                const a = document.createElement('a');
                a.href = grp.link;
                a.className = 'group-link-item box is-flex is-justify-content-between is-align-items-center py-3 px-4 mb-2';
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.innerHTML = `
                    <span>${grp.name}</span>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
                `;
                list.appendChild(a);
            });
        }
    }
}

function toggleLanguage(btn) {
    btn.classList.toggle('active');
    updateActiveLanguages();
}

function selectAllLanguages() {
    const buttons = document.querySelectorAll('.lang-toggle-btn');
    buttons.forEach(btn => btn.classList.add('active'));
    updateActiveLanguages();
}

function clearAllLanguages() {
    const buttons = document.querySelectorAll('.lang-toggle-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    updateActiveLanguages();
}

function updateActiveLanguages() {
    const buttons = document.querySelectorAll('.lang-toggle-btn');
    activeLanguages = [];
    buttons.forEach(btn => {
        if (btn.classList.contains('active')) {
            activeLanguages.push(btn.dataset.lang);
        }
    });
    saveFiltersState();
    applyFilters();
}

function filterEvents(type) {
    activeType = type;
    const buttons = document.querySelectorAll('.filters .filter-btn');
    buttons.forEach(btn => {
        btn.classList.remove('active');
        if (btn.getAttribute('onclick').includes(type)) {
            btn.classList.add('active');
        }
    });
    saveFiltersState();
    applyFilters();
}

function toggleTopic(btn) {
    btn.classList.toggle('active');
    updateActiveTopics();
}

function selectAllTopics() {
    const buttons = document.querySelectorAll('.topic-toggle-btn');
    buttons.forEach(btn => btn.classList.add('active'));
    updateActiveTopics();
}

function clearAllTopics() {
    const buttons = document.querySelectorAll('.topic-toggle-btn');
    buttons.forEach(btn => btn.classList.remove('active'));
    updateActiveTopics();
}

function updateActiveTopics() {
    const buttons = document.querySelectorAll('.topic-toggle-btn');
    activeTopics = [];
    buttons.forEach(btn => {
        if (btn.classList.contains('active')) {
            activeTopics.push(btn.dataset.topic);
        }
    });
    saveFiltersState();
    applyFilters();
}

function onTimeFilterToggle() {
    const checkbox = document.getElementById('time-filter-toggle');
    if (!checkbox) return;
    timeFilterEnabled = checkbox.checked;

    const startAfter = document.getElementById('start-after');
    const startBefore = document.getElementById('start-before');

    if (startAfter && startBefore) {
        const saWrapper = startAfter.closest('.select-wrapper');
        const sbWrapper = startBefore.closest('.select-wrapper');
        if (timeFilterEnabled) {
            startAfter.disabled = false;
            startBefore.disabled = false;
            if (saWrapper) saWrapper.classList.remove('disabled');
            if (sbWrapper) sbWrapper.classList.remove('disabled');
        } else {
            startAfter.disabled = true;
            startBefore.disabled = true;
            if (saWrapper) saWrapper.classList.add('disabled');
            if (sbWrapper) sbWrapper.classList.add('disabled');
        }
    }

    saveFiltersState();
    applyFilters();
}

function onTimeFilterChange() {
    const startAfter = document.getElementById('start-after');
    const startBefore = document.getElementById('start-before');
    startAfterHour = startAfter ? parseFloat(startAfter.value) : 0;
    startBeforeHour = startBefore ? parseFloat(startBefore.value) : 24;
    saveFiltersState();
    applyFilters();
}

function applyFilters() {
    const cards = document.querySelectorAll('.event-column');
    let visibleCount = 0;

    cards.forEach(card => {
        const matchesType = activeType === 'all' || card.dataset.type === activeType;
        
        let matchesTopic = true;
        const topicButtons = document.querySelectorAll('.topic-toggle-btn');
        if (topicButtons.length > 0) {
            if (activeTopics.length === topicButtons.length) {
                matchesTopic = true;
            } else {
                const cardTopics = card.dataset.topics ? card.dataset.topics.split(',') : [];
                matchesTopic = cardTopics.some(t => activeTopics.includes(t));
            }
        }

        let matchesTime = true;
        if (timeFilterEnabled) {
            const dateTimeEl = card.querySelector('.date-time');
            const utcStr = dateTimeEl ? dateTimeEl.dataset.utc : null;
            if (utcStr) {
                const date = new Date(utcStr);
                const hour = date.getHours() + date.getMinutes() / 60.0;
                matchesTime = hour >= startAfterHour && hour <= startBeforeHour;
            }
        }

        let matchesLanguage = true;
        const buttons = document.querySelectorAll('.lang-toggle-btn');
        if (buttons.length > 0) {
            const cardLang = card.dataset.language || 'Unknown';
            matchesLanguage = activeLanguages.includes(cardLang);
        }

        if (matchesType && matchesTopic && matchesTime && matchesLanguage) {
            card.style.display = 'flex';
            visibleCount++;
        } else {
            card.style.display = 'none';
        }
    });

    const visibleEl = document.getElementById('visible-count');
    if (visibleEl) {
        visibleEl.innerText = visibleCount;
    }

    let noEventsMsg = document.getElementById('no-filter-results');
    if (visibleCount === 0) {
        if (!noEventsMsg) {
            noEventsMsg = document.createElement('div');
            noEventsMsg.id = 'no-filter-results';
            noEventsMsg.className = 'no-events';
            noEventsMsg.innerHTML = 'No events match the selected filters.';
            document.getElementById('events-grid').appendChild(noEventsMsg);
        }
    } else if (noEventsMsg) {
        noEventsMsg.remove();
    }
}

function formatDates() {
    const dateElements = document.querySelectorAll(".date-time");
    dateElements.forEach(el => {
        const utcStr = el.dataset.utc;
        if (utcStr) {
            const date = new Date(utcStr);
            const options = {
                year: 'numeric',
                month: 'short',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            };
            el.innerText = date.toLocaleString(undefined, options);
        }
    });
}

function renderFuturePage(events) {
    const totalCountEl = document.getElementById('total-count');
    if (totalCountEl) {
        totalCountEl.innerText = events.length;
    }

    // 1. Build language counts
    const langCounts = {};
    events.forEach(e => {
        const lang = e.language || 'Unknown';
        langCounts[lang] = (langCounts[lang] || 0) + 1;
    });
    const sortedLangs = Object.keys(langCounts).sort();
    const unknownIdx = sortedLangs.indexOf('Unknown');
    if (unknownIdx !== -1) {
        sortedLangs.splice(unknownIdx, 1);
        sortedLangs.push('Unknown');
    }
    const langContainer = document.getElementById('language-buttons');
    if (langContainer) {
        langContainer.innerHTML = '';
        sortedLangs.forEach(lang => {
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'button is-small is-rounded lang-toggle-btn active';
            btn.dataset.lang = lang;
            btn.onclick = () => toggleLanguage(btn);
            btn.innerText = `${lang} (${langCounts[lang]})`;
            langContainer.appendChild(btn);
        });
    }

    // 2. Build topic counts
    const topicMap = {};
    events.forEach(e => {
        if (e.data_topics && e.data_topic_names) {
            const urlkeys = e.data_topics.split(',');
            const names = e.data_topic_names.split(',');
            urlkeys.forEach((key, idx) => {
                const name = names[idx] || key;
                if (!topicMap[key]) {
                    topicMap[key] = { name: name, count: 0 };
                }
                topicMap[key].count++;
            });
        }
    });
    const sortedTopics = Object.keys(topicMap).sort((a, b) => {
        return topicMap[a].name.localeCompare(topicMap[b].name);
    });
    const topicContainer = document.getElementById('topic-buttons');
    if (topicContainer) {
        topicContainer.innerHTML = '';
        sortedTopics.forEach(key => {
            const t = topicMap[key];
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'button is-small is-rounded topic-toggle-btn active';
            btn.dataset.topic = key;
            btn.onclick = () => toggleTopic(btn);
            btn.innerText = `${t.name} (${t.count})`;
            topicContainer.appendChild(btn);
        });
    }

    // 3. Render events
    const eventsGrid = document.getElementById('events-grid');
    if (eventsGrid) {
        eventsGrid.innerHTML = '';
        if (events.length === 0) {
            eventsGrid.innerHTML = `
                <div class="column is-12 no-events text-center">
                    <div class="notification is-light">
                        No upcoming events found. Run <code>collect</code> to fetch the latest updates.
                    </div>
                </div>
            `;
        } else {
            events.forEach(event => {
                const cardCol = document.createElement('div');
                cardCol.className = 'column is-4-desktop is-6-tablet event-column';
                cardCol.dataset.type = event.card_type;
                cardCol.dataset.topics = event.data_topics;
                cardCol.dataset.topicNames = event.data_topic_names;
                cardCol.dataset.language = event.language || 'Unknown';
                
                cardCol.innerHTML = `
                    <div class="card is-flex is-flex-direction-column" style="height: 100%;">
                        <header class="card-header is-shadowless">
                            <div class="card-header-title is-flex is-justify-content-between is-align-items-center w-100 px-4 py-3">
                                <span class="tag ${event.card_type}">${event.badge_text}</span>
                                <span class="date-time is-size-7 has-text-grey" data-utc="${event.utc_datetime}">${event.date_str}</span>
                            </div>
                        </header>
                        <div class="card-content px-4 py-3 is-flex-grow-1">
                            <a href="${event.event_url}" class="title is-5 is-block mb-2" target="_blank" rel="noopener noreferrer" style="line-clamp: 2; -webkit-line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; height: 3.0em;">${event.title}</a>
                            <p class="subtitle is-6 has-text-grey">by ${event.group_name}${event.language ? ' • ' + event.language : ''}</p>
                        </div>
                        <footer class="card-footer">
                            <a href="${event.event_url}" class="card-footer-item" target="_blank" rel="noopener noreferrer">
                                Details
                            </a>
                        </footer>
                    </div>
                `;
                eventsGrid.appendChild(cardCol);
            });
        }
    }

    formatDates();

    // Default active states
    const langButtons = document.querySelectorAll('.lang-toggle-btn');
    if (langButtons.length > 0) {
        activeLanguages = Array.from(langButtons).map(btn => btn.dataset.lang);
    }
    const topicButtons = document.querySelectorAll('.topic-toggle-btn');
    if (topicButtons.length > 0) {
        activeTopics = Array.from(topicButtons).map(btn => btn.dataset.topic);
    }

    // Load from localStorage
    let savedState = null;
    try {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            savedState = JSON.parse(stored);
        }
    } catch (e) {
        console.error('Failed to load filters state from localStorage:', e);
    }

    if (savedState) {
        if (savedState.hasOwnProperty('activeType')) {
            activeType = savedState.activeType;
            const buttons = document.querySelectorAll('.filters .filter-btn');
            buttons.forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('onclick') && btn.getAttribute('onclick').includes(activeType)) {
                    btn.classList.add('active');
                }
            });
        }
        if (savedState.hasOwnProperty('timeFilterEnabled')) {
            timeFilterEnabled = savedState.timeFilterEnabled;
            const checkbox = document.getElementById('time-filter-toggle');
            if (checkbox) {
                checkbox.checked = timeFilterEnabled;
            }
            const startAfter = document.getElementById('start-after');
            const startBefore = document.getElementById('start-before');
            if (startAfter && startBefore) {
                const saWrapper = startAfter.closest('.select-wrapper');
                const sbWrapper = startBefore.closest('.select-wrapper');
                if (timeFilterEnabled) {
                    startAfter.disabled = false;
                    startBefore.disabled = false;
                    if (saWrapper) saWrapper.classList.remove('disabled');
                    if (sbWrapper) sbWrapper.classList.remove('disabled');
                } else {
                    startAfter.disabled = true;
                    startBefore.disabled = true;
                    if (saWrapper) saWrapper.classList.add('disabled');
                    if (sbWrapper) sbWrapper.classList.add('disabled');
                }
            }
        }
        if (savedState.hasOwnProperty('startAfterHour')) {
            startAfterHour = savedState.startAfterHour;
            const startAfter = document.getElementById('start-after');
            if (startAfter) {
                startAfter.value = startAfterHour.toString();
            }
        }
        if (savedState.hasOwnProperty('startBeforeHour')) {
            startBeforeHour = savedState.startBeforeHour;
            const startBefore = document.getElementById('start-before');
            if (startBefore) {
                startBefore.value = startBeforeHour.toString();
            }
        }
        if (savedState.hasOwnProperty('activeTopics') && Array.isArray(savedState.activeTopics)) {
            activeTopics = savedState.activeTopics;
            const tBtns = document.querySelectorAll('.topic-toggle-btn');
            tBtns.forEach(btn => {
                if (activeTopics.includes(btn.dataset.topic)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
        if (savedState.hasOwnProperty('activeLanguages') && Array.isArray(savedState.activeLanguages)) {
            activeLanguages = savedState.activeLanguages;
            const lBtns = document.querySelectorAll('.lang-toggle-btn');
            lBtns.forEach(btn => {
                if (activeLanguages.includes(btn.dataset.lang)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }
    }

    applyFilters();
}

document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
        const settingsOverlay = document.getElementById('settings-overlay');
        const settingsPanel = document.getElementById('settings-panel');
        if (settingsPanel && settingsPanel.classList.contains('open')) {
            settingsOverlay.classList.remove('open');
            settingsPanel.classList.remove('open');
        }

        const groupsOverlay = document.getElementById('groups-overlay');
        const groupsPanel = document.getElementById('groups-panel');
        if (groupsPanel && groupsPanel.classList.contains('open')) {
            groupsOverlay.classList.remove('open');
            groupsPanel.classList.remove('open');
        }
    }
});

document.addEventListener("DOMContentLoaded", () => {
    const isFuturePage = !!document.getElementById('settings-panel');

    // Fetch meta.json and update the generation time
    fetch('meta.json')
        .then(res => res.json())
        .then(meta => {
            const genEl = document.getElementById('generated-at');
            if (genEl && meta.generated_at) {
                genEl.innerText = meta.generated_at;
            }
        })
        .catch(err => {
            console.error('Failed to load meta.json:', err);
        });

    if (isFuturePage) {
        fetch('events.json')
            .then(res => res.json())
            .then(events => {
                renderFuturePage(events);
            })
            .catch(err => {
                console.error('Failed to load events:', err);
                const grid = document.getElementById('events-grid');
                if (grid) {
                    grid.innerHTML = '<div class="column is-12"><div class="notification is-danger">Failed to load events list.</div></div>';
                }
            });
    } else {
        formatDates();
        applyFilters();
    }
});

    </script>
</body>
</html>
